name: Daily Horizon Summary
on:
  schedule:
    - cron: '0 21 * * 5'   # UTC周五21点 == 北京时间 周六 05:00，一周一次
  workflow_dispatch:      # 手动运行

jobs:
  daily-summary:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv sync

      - name: Run Horizon & Push notification
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: https://api.siliconflow.cn/v1
          HORIZON_WEBHOOK_URL: ${{ secrets.HORIZON_WEBHOOK_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          uv run horizon --hours 24
          SUMMARY_FILE=$(ls -t ./data/summaries/horizon-*-zh.md | head -n1)
          echo "找到摘要文件：$SUMMARY_FILE"
          TITLE="Horizon 每周资讯摘要 $(date +%Y-%m-%d)"
          CONTENT=$(cat "$SUMMARY_FILE")
          curl -s -X POST $HORIZON_WEBHOOK_URL \
            -H "Content-Type: application/json" \
            -d "{\"title\":\"$TITLE\",\"content\":\"$CONTENT\",\"template\":\"markdown\"}"

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          keep_files: true
          commit_message: "Weekly Summary: $(date +%Y-%m-%d)"
          publish_branch: gh-pages
          enable_jekyll: true
